<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation System - Interactive Map</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, sans-serif;
        background: #f5f5f5;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        display: flex;
        height: 100vh;
        gap: 0;
      }

      .sidebar {
        width: 350px;
        background: white;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }

      .header {
        margin-bottom: 30px;
      }

      .header h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header p {
        color: #999;
        font-size: 13px;
      }

      .map-container {
        flex: 1;
        position: relative;
      }

      #map {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }

      .section {
        margin-bottom: 25px;
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: #667eea;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-title::before {
        content: "▸";
        font-size: 16px;
      }

      .form-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        color: #555;
        font-weight: 500;
        margin-bottom: 6px;
        font-size: 13px;
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s, box-shadow 0.3s;
        font-family: inherit;
      }

      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .input-wrapper {
        position: relative;
      }

      .suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 2px solid #e0e0e0;
        border-top: none;
        border-radius: 0 0 6px 6px;
        max-height: 150px;
        overflow-y: auto;
        z-index: 100;
        display: none;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .suggestions.active {
        display: block;
      }

      .suggestion-item {
        padding: 10px 12px;
        cursor: pointer;
        transition: background 0.2s;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
      }

      .suggestion-item:hover {
        background: #f5f5f5;
      }

      .suggestion-item:last-child {
        border-bottom: none;
      }

      button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        width: 100%;
        margin-top: 5px;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #333;
        margin-top: 8px;
      }

      .btn-secondary:hover {
        background: #e0e0e0;
      }

      .info-box {
        background: #f0f4ff;
        border: 2px solid #d0d8ff;
        border-radius: 6px;
        padding: 12px;
        color: #333;
        font-size: 12px;
        margin-bottom: 20px;
        line-height: 1.5;
      }

      .info-box strong {
        color: #667eea;
      }

      .route-info {
        background: #f9f9f9;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        padding: 15px;
        margin-top: 15px;
        display: none;
      }

      .route-info.active {
        display: block;
      }

      .route-detail {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #e0e0e0;
        font-size: 13px;
      }

      .route-detail:last-child {
        border-bottom: none;
      }

      .route-label {
        color: #999;
        font-weight: 500;
      }

      .route-value {
        color: #333;
        font-weight: 600;
      }

      .error {
        background: #fee;
        border: 2px solid #fcc;
        border-radius: 6px;
        padding: 12px;
        color: #c33;
        margin-top: 10px;
        display: none;
        font-size: 13px;
      }

      .error.active {
        display: block;
      }

      .error::before {
        content: "⚠️ ";
        margin-right: 6px;
      }

      .loading {
        display: none;
        color: #666;
        font-size: 12px;
        margin-top: 10px;
        align-items: center;
        gap: 8px;
      }

      .loading.active {
        display: flex;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #e0e0e0;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .action-buttons button {
        flex: 1;
        padding: 8px 12px;
        margin: 0;
        font-size: 13px;
      }

      .leaflet-control-routing {
        background: transparent !important;
        border: none !important;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          max-height: 40vh;
          border-radius: 16px 16px 0 0;
        }

        .map-container {
          height: 60vh;
        }
      }

      /* Scrollbar styling */
      .sidebar::-webkit-scrollbar {
        width: 6px;
      }

      .sidebar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      .sidebar::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 3px;
      }

      .sidebar::-webkit-scrollbar-thumb:hover {
        background: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="header">
          <h1>🗺️ Navigation</h1>
          <p>Find routes on the interactive map</p>
        </div>

        <div class="info-box">
          <strong>How to use:</strong> Search for cities and click "Calculate
          Route" to draw the path on the map.
        </div>

        <!-- Search Section -->
        <div class="section">
          <div class="section-title">Search Cities</div>
          <div class="form-group">
            <label for="search-input">Find a City</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="search-input"
                placeholder="e.g., Paris, Lon..."
                autocomplete="off"
              />
              <div class="suggestions" id="suggestions"></div>
            </div>
          </div>
          <button class="btn-secondary" onclick="handleSearchCity()">
            Pin City
          </button>
          <div class="loading" id="search-loading">
            <span class="spinner"></span>Searching...
          </div>
          <div class="error" id="search-error"></div>
        </div>

        <!-- Route Calculation Section -->
        <div class="section">
          <div class="section-title">Calculate Route</div>

          <div class="form-group">
            <label for="route-from">From</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="route-from"
                placeholder="Starting city..."
                autocomplete="off"
              />
              <div class="suggestions" id="suggestions-from"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="route-to">To</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="route-to"
                placeholder="Destination city..."
                autocomplete="off"
              />
              <div class="suggestions" id="suggestions-to"></div>
            </div>
          </div>

          <button class="btn-primary" onclick="handleCalculateRoute()">
            Calculate Route
          </button>
          <div class="loading" id="route-loading">
            <span class="spinner"></span>Calculating...
          </div>
          <div class="error" id="route-error"></div>

          <!-- Route Info Display -->
          <div class="route-info" id="route-info">
            <div class="route-detail">
              <span class="route-label">From:</span>
              <span class="route-value" id="route-info-from"></span>
            </div>
            <div class="route-detail">
              <span class="route-label">To:</span>
              <span class="route-value" id="route-info-to"></span>
            </div>
            <div class="route-detail">
              <span class="route-label">Distance:</span>
              <span class="route-value" id="route-info-distance"></span>
            </div>
            <div class="action-buttons">
              <button
                class="btn-secondary"
                onclick="clearRoute()"
                style="font-size: 12px"
              >
                Clear Route
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Map Container -->
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <!-- Leaflet Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
      // Initialize map centered on Europe
      const map = L.map("map").setView([48, 10], 4);

      // Add base layer
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      // Store markers and routes
      let markers = {};
      let currentRoute = null;
      let allCities = [];

      // Load cities on page load
      async function loadCities() {
        try {
          const response = await fetch("/api/cities");
          const data = await response.json();
          allCities = data.cities;
          console.log(`Loaded ${allCities.length} cities`);
        } catch (error) {
          console.error("Error loading cities:", error);
        }
      }

      // Setup autocomplete for search input
      setupAutocomplete("search-input", "suggestions");
      setupAutocomplete("route-from", "suggestions-from");
      setupAutocomplete("route-to", "suggestions-to");

      function setupAutocomplete(inputId, suggestionsId) {
        const input = document.getElementById(inputId);
        const suggestionsDiv = document.getElementById(suggestionsId);

        input.addEventListener("input", async function (e) {
          const value = this.value.trim();

          if (value.length < 1) {
            suggestionsDiv.classList.remove("active");
            return;
          }

          try {
            const response = await fetch("/api/search", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prefix: value }),
            });

            const data = await response.json();
            const results = data.results || [];

            if (results.length === 0) {
              suggestionsDiv.classList.remove("active");
              return;
            }

            suggestionsDiv.innerHTML = results
              .map(
                (city) =>
                  `<div class="suggestion-item" onclick="selectCity('${city}', '${inputId}')">${city}</div>`
              )
              .join("");
            suggestionsDiv.classList.add("active");
          } catch (error) {
            console.error("Error fetching suggestions:", error);
          }
        });
      }

      function selectCity(city, inputId) {
        document.getElementById(inputId).value = city;
        const suggestionsId =
          inputId + "-suggestions" === "search-input-suggestions"
            ? "suggestions"
            : "suggestions-" + inputId.split("-")[1];
        const suggestionsDiv = document.getElementById(suggestionsId);
        if (suggestionsDiv) {
          suggestionsDiv.classList.remove("active");
        }
      }

      function findCityCoordinates(cityName) {
        const city = allCities.find(
          (c) => c.name.toLowerCase() === cityName.toLowerCase()
        );
        return city ? { lat: city.lat, lng: city.lng } : null;
      }

      function handleSearchCity() {
        const cityName = document.getElementById("search-input").value.trim();
        clearError("search");

        if (!cityName) {
          showError("search", "Please enter a city name");
          return;
        }

        const coords = findCityCoordinates(cityName);
        if (!coords) {
          showError("search", `City "${cityName}" not found`);
          return;
        }

        // Remove old marker for this city if exists
        if (markers[cityName]) {
          map.removeLayer(markers[cityName]);
        }

        // Add marker to map
        const marker = L.circleMarker([coords.lat, coords.lng], {
          radius: 8,
          fillColor: "#667eea",
          color: "#fff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.8,
        })
          .addTo(map)
          .bindPopup(
            `<strong>${cityName}</strong><br/>Lat: ${coords.lat.toFixed(
              4
            )}<br/>Lng: ${coords.lng.toFixed(4)}`
          )
          .openPopup();

        markers[cityName] = marker;
        map.setView([coords.lat, coords.lng], 6);
        document.getElementById("search-input").value = "";
      }

      async function handleCalculateRoute() {
        const from = document.getElementById("route-from").value.trim();
        const to = document.getElementById("route-to").value.trim();

        clearError("route");
        document.getElementById("route-info").classList.remove("active");

        if (!from || !to) {
          showError(
            "route",
            "Please enter both starting and destination cities"
          );
          return;
        }

        if (from.toLowerCase() === to.toLowerCase()) {
          showError("route", "Start and end cities must be different");
          return;
        }

        const fromCoords = findCityCoordinates(from);
        const toCoords = findCityCoordinates(to);

        if (!fromCoords || !toCoords) {
          showError("route", "One or both cities not found");
          return;
        }

        showLoading("route");

        try {
          const response = await fetch("/api/route", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ start: from, end: to }),
          });

          const data = await response.json();

          if (data.error) {
            showError("route", data.error);
          } else {
            // Clear previous route
            if (currentRoute) {
              map.removeControl(currentRoute);
            }

            // Draw route on map
            currentRoute = L.Routing.control({
              waypoints: [
                L.latLng(fromCoords.lat, fromCoords.lng),
                L.latLng(toCoords.lat, toCoords.lng),
              ],
              routeWhileDragging: false,
              showAlternatives: false,
              lineOptions: {
                styles: [{ color: "#667eea", opacity: 0.7, weight: 5 }],
              },
              createMarker: function (i, wp) {
                if (i === 0) {
                  return L.marker(wp.latLng, {
                    draggable: false,
                    icon: L.icon({
                      iconUrl:
                        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png",
                      iconSize: [25, 41],
                      iconAnchor: [12, 41],
                    }),
                  });
                } else {
                  return L.marker(wp.latLng, {
                    draggable: false,
                    icon: L.icon({
                      iconUrl:
                        "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png",
                      iconSize: [25, 41],
                      iconAnchor: [12, 41],
                    }),
                  });
                }
              },
            }).addTo(map);

            // Display route info
            document.getElementById("route-info-from").textContent = from;
            document.getElementById("route-info-to").textContent = to;
            document.getElementById(
              "route-info-distance"
            ).textContent = `${data.distance} km`;
            document.getElementById("route-info").classList.add("active");

            // Fit map to route bounds
            const bounds = L.latLngBounds([
              [fromCoords.lat, fromCoords.lng],
              [toCoords.lat, toCoords.lng],
            ]);
            map.fitBounds(bounds, { padding: [100, 100] });
          }
        } catch (error) {
          showError("route", error.message);
        } finally {
          hideLoading("route");
        }
      }

      function clearRoute() {
        if (currentRoute) {
          map.removeControl(currentRoute);
          currentRoute = null;
        }
        document.getElementById("route-from").value = "";
        document.getElementById("route-to").value = "";
        document.getElementById("route-info").classList.remove("active");
        clearError("route");
      }

      function showError(section, message) {
        const error = document.getElementById(section + "-error");
        error.textContent = message;
        error.classList.add("active");
      }

      function clearError(section) {
        const error = document.getElementById(section + "-error");
        error.classList.remove("active");
      }

      function showLoading(section) {
        const loading = document.getElementById(section + "-loading");
        loading.classList.add("active");
      }

      function hideLoading(section) {
        const loading = document.getElementById(section + "-loading");
        loading.classList.remove("active");
      }

      // Allow Enter key to calculate route
      document
        .getElementById("route-from")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") handleCalculateRoute();
        });

      document
        .getElementById("route-to")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") handleCalculateRoute();
        });

      // Load cities when page loads
      loadCities();
    </script>
  </body>
</html>
